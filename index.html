<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE - Escultura de Alexander Milov</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-container">
        <!-- Fundo gradiente -->
        <div class="background"></div>
        
        <!-- Container da escultura -->
        <div class="sculpture-wrapper">
            <!-- Children - base -->
            <img src="imgs/children.png" alt="Children - Base da escultura" class="children" id="childrenImg">
            
            <!-- Frame (Mãos) - sobreposto -->
            <img src="imgs/frame.png" alt="Frame - Mãos da escultura" class="frame" id="frameImg">
        </div>

        <!-- Elementos decorativos -->
        <div class="particles"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
